<!DOCTYPE html><html lang='zh'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>LRU 缓存模拟器</title><style>body{font-family:sans-serif;padding:20px;line-height:1.6;font-size:14px;color:#333}section{margin-bottom:20px;border-bottom:1px solid #eee;padding-bottom:10px}pre{background:#f4f4f4;padding:10px;overflow-x:auto}.controls{display:flex;flex-direction:column;gap:10px}.item{display:inline-block;padding:5px 10px;margin:2px;border:1px solid #999;border-radius:4px}</style></head><body><h1>LRU 缓存淘汰：原理与模拟</h1><section><h2>核心原理</h2><p>LRU 算法根据最近访问时间管理缓存。访问时，该项被标记为最活跃（移至队列尾部）。容量满时，淘汰最久未访问的元素（队列头部）。</p></section><section><h2>误区提示</h2><p>LRU 不是 FIFO。FIFO 不会因访问而改变顺序，而 LRU 会通过访问操作更新元素的“新鲜度”。</p></section><section><h2>交互演示</h2><div class='controls'><input type='text' data-testid='data' placeholder='访问序列 (如: A,B,C)' aria-label='访问序列'><input type='text' data-testid='parameter' placeholder='容量 (int)' aria-label='容量'><button id='run' aria-label='运行'>运行</button><button id='reset' aria-label='重置'>重置</button></div><pre id='output' aria-label='输出'></pre></section><script>let cache = [];let capacity = 0;document.getElementById('run').onclick = () => {const dataStr = document.querySelector('[data-testid=data]').value;const paramStr = document.querySelector('[data-testid=parameter]').value;capacity = parseInt(paramStr);if(isNaN(capacity) || capacity < 0) return;const sequence = dataStr.split(',').map(s => s.trim()).filter(s => s);cache = [];for(const key of sequence){if(capacity === 0) continue;const idx = cache.indexOf(key);if(idx > -1){cache.splice(idx, 1);}else if(cache.length >= capacity){cache.shift();}cache.push(key);}document.getElementById('output').textContent = JSON.stringify({cache: cache});};document.getElementById('reset').onclick = () => {cache = [];capacity = 0;document.getElementById('output').textContent = JSON.stringify({ready: true});};</script></body></html>
