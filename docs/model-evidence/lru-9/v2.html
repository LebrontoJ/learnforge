<!DOCTYPE html><html lang='zh'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>精确 LRU 缓存模拟器</title><style>body{font-family:sans-serif;padding:20px;line-height:1.6;font-size:14px;color:#333;max-width:375px;margin:auto}section{margin-bottom:20px;border-bottom:1px solid #eee;padding-bottom:10px}pre{background:#f4f4f4;padding:10px;word-break:break-all}button{margin:5px 0;padding:8px;width:100%}.controls{display:flex;flex-direction:column;gap:5px}input{padding:8px;width:100%;box-sizing:border-box}</style></head><body><h1>LRU 缓存模拟器</h1><section><h2>核心原理</h2><p>LRU (Least Recently Used) 依据“局部性原理”。缓存满时，移除最久未访问的条目（列表头部），新访问/插入的条目移至最近端（列表尾部）。</p></section><section><h2>交互演示</h2><div class='controls'><input type='text' data-testid='data' placeholder='访问序列 (如: A,B,C)' aria-label='访问序列'><input type='text' data-testid='parameter' placeholder='容量 (int)' aria-label='容量'><button id='step' aria-label='步进'>步进 (单步演示)</button><button id='run' aria-label='运行'>运行 (一次性)</button><button id='reset' aria-label='重置'>重置</button></div><pre id='output' aria-label='输出'>{}</pre></section><script>let state = {cache: [], sequence: [], pointer: 0, capacity: 0};document.getElementById('step').onclick = () => {if(state.pointer >= state.sequence.length) return;const key = state.sequence[state.pointer];const idx = state.cache.indexOf(key);if(idx > -1){state.cache.splice(idx, 1);}else if(state.capacity > 0 && state.cache.length >= state.capacity){state.cache.shift();}if(state.capacity > 0) state.cache.push(key);state.pointer++;document.getElementById('output').textContent = JSON.stringify({cache: state.cache, step: state.pointer, total: state.sequence.length});};document.getElementById('run').onclick = () => {const data = document.querySelector('[data-testid=data]').value;const cap = parseInt(document.querySelector('[data-testid=parameter]').value);state.capacity = isNaN(cap) ? 0 : cap;state.sequence = data.split(',').map(s => s.trim()).filter(s => s);state.cache = [];state.pointer = 0;for(let i=0; i<state.sequence.length; i++) document.getElementById('step').onclick();};document.getElementById('reset').onclick = () => {state = {cache: [], sequence: [], pointer: 0, capacity: 0};document.getElementById('output').textContent = JSON.stringify({ready: true});};</script></body></html>
