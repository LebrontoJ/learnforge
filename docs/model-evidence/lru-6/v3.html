<!DOCTYPE html><html lang='zh'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>精确 LRU 缓存淘汰演示</title><style>body{font-family:sans-serif;padding:20px;line-height:1.6;max-width:375px;margin:auto}pre{background:#f4f4f4;padding:10px;overflow-x:auto;word-wrap:break-word}.step-ui{margin:20px 0;padding:15px;border:1px solid #ccc}button{margin:5px;padding:8px 12px}input{display:block;width:100%;margin-bottom:10px;padding:8px;box-sizing:border-box}</style></head><body><h1>LRU 缓存淘汰演示</h1><p>LRU (Least Recently Used) 核心：<strong>命中提升至最前，满容则移除末尾</strong>。</p><h3>核心概念</h3><p>缓存中，越靠近列表开头越“新鲜”。访问命中时，移动该项至首位；插入新值且超容时，移除末尾元素。</p><h3>模拟演示</h3><div class='step-ui'><label>数据序列:</label><input type='text' data-testid='data' id='dataInput' value='A,B,A,C' aria-label='数据序列'><label>容量:</label><input type='text' data-testid='parameter' id='capInput' value='2' aria-label='容量'><button id='reset' data-testid='reset'>reset</button><button id='run' data-testid='run'>run</button><button id='step' data-testid='step'>step</button><pre data-testid='output' id='output'>等待操作...</pre></div><script>let cache = [];let stepIndex = 0;const dataInput = document.getElementById('dataInput');const capInput = document.getElementById('capInput');const output = document.getElementById('output');const resetBtn = document.getElementById('reset');const runBtn = document.getElementById('run');const stepBtn = document.getElementById('step');function getSequence() {return dataInput.value.split(',').map(s => s.trim()).filter(s => s !== '');}function processStep() {const cap = parseInt(capInput.value);if(isNaN(cap) || cap < 0) return {error: '非法容量'};const seq = getSequence();if(stepIndex >= seq.length) return null;const key = seq[stepIndex];const hitIdx = cache.indexOf(key);if(hitIdx > -1) {cache.splice(hitIdx, 1);cache.unshift(key);} else {if(cap > 0) {cache.unshift(key);if(cache.length > cap) cache.pop();}}stepIndex++;return {cache: [...cache]};}resetBtn.addEventListener('click', () => {cache = [];stepIndex = 0;output.textContent = JSON.stringify({ready: true});});runBtn.addEventListener('click', () => {let res;const seqLen = getSequence().length;while(stepIndex < seqLen) {res = processStep();}output.textContent = JSON.stringify({cache: cache});});stepBtn.addEventListener('click', () => {const res = processStep();output.textContent = JSON.stringify(res || {cache, finished: true});});</script></body></html>
