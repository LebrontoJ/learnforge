<!DOCTYPE html><html lang='zh'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>精确 LRU 缓存淘汰演示</title><style>body{font-family:sans-serif;padding:20px;line-height:1.6;max-width:375px;margin:auto}pre{background:#f4f4f4;padding:10px;overflow-x:auto}.step-ui{margin:20px 0;padding:15px;border:1px solid #ccc}input{display:block;width:100%;margin-bottom:10px;box-sizing:border-box}</style></head><body><h1>LRU 缓存淘汰</h1><p>LRU (Least Recently Used) 是一种基于访问时间的淘汰策略，核心在于：<strong>命中即提升，满容则挤出最远端</strong>。</p><h3>核心解释</h3><p>当访问已存在元素时，该元素被标记为“最近使用”，在序列中从旧位置移至最前端。</p><h3>例子</h3><p>容量2，访问 [A, B, A, C]：A(A), AB(B,A), A(A,B)->hit(B,A), C(A,C)</p><h3>误区</h3><p>混淆了 LRU 与 FIFO。FIFO 不管是否命中，插入时间决定优先级；LRU 则因“命中”而改变顺序。</p><div class='step-ui'><label>数据序列 (逗号分隔):</label><input type='text' data-testid='data' id='dataInput' value='A,B,A,C'><label>容量:</label><input type='text' data-testid='parameter' id='capInput' value='2'><button id='reset'>reset</button><button id='run'>step</button><pre data-testid='output' id='output'></pre></div><script>let cache = [];let stepIndex = 0;const dataInput = document.getElementById('dataInput');const capInput = document.getElementById('capInput');const output = document.getElementById('output');const resetBtn = document.getElementById('reset');const runBtn = document.getElementById('run');resetBtn.onclick = () => {cache = [];stepIndex = 0;output.textContent = JSON.stringify({ready: true, cache});};runBtn.onclick = () => {const data = dataInput.value.split(',').map(s => s.trim());const cap = parseInt(capInput.value);if(isNaN(cap) || cap < 0) return;if(stepIndex >= data.length) return;const key = data[stepIndex];const hitIdx = cache.indexOf(key);if(hitIdx > -1) {cache.splice(hitIdx, 1);cache.unshift(key);} else {if(cap > 0) {cache.unshift(key);if(cache.length > cap) cache.pop();}}stepIndex++;output.textContent = JSON.stringify({cache: [...cache]});};</script></body></html>
