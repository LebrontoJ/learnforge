<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>等间隔 Counter 重置感知平均增量教学</title><style>body{font-family:sans-serif;padding:16px;line-height:1.5;max-width:375px;margin:auto}section{margin-bottom:20px}pre{background:#f4f4f4;padding:10px;overflow-x:auto;font-size:12px}label{display:block;margin-top:10px}input{width:100%;margin-top:4px}button{margin-top:10px;padding:8px;width:100%}</style></head><body><h1>等间隔 Counter 计算</h1><section><h2>核心概念</h2><p>在等间隔采样中，处理计数器递增与重置。若C2 &gt;= C1，增量为C2-C1；若C2 &lt; C1，视为发生了重置，增量直接为C2。</p></section><section><h2>交互模拟</h2><label>前一时刻值 (C1): <input type="number" data-testid="c1" value="100"></label><label>后一时刻值 (C2): <input type="number" data-testid="c2" value="50"></label><label>时间间隔 (Δt): <input type="number" data-testid="dt" value="10"></label><button data-testid="run">计算速率</button><button data-testid="reset">重置</button><pre data-testid="output">{}</pre></section><script>const c1=document.querySelector('[data-testid="c1"]');const c2=document.querySelector('[data-testid="c2"]');const dt=document.querySelector('[data-testid="dt"]');const out=document.querySelector('[data-testid="output"]');const run=document.querySelector('[data-testid="run"]');const res=document.querySelector('[data-testid="reset"]');run.onclick=()=>{const v1=parseInt(c1.value);const v2=parseInt(c2.value);const t=parseInt(dt.value);if(t<=0){out.textContent=JSON.stringify({error:"时间间隔必须大于0"});return;}const delta=v2>=v1?v2-v1:v2;out.textContent=JSON.stringify({rate:delta/t});};res.onclick=()=>{c1.value="100";c2.value="50";dt.value="10";out.textContent=JSON.stringify({ready:true});};</script></body></html>
