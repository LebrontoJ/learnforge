<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>等间隔 Counter 重置感知平均增量教学</title><style>body{font-family:sans-serif;padding:16px;line-height:1.5;max-width:375px;margin:auto}section{margin-bottom:20px}pre{background:#f4f4f4;padding:10px;overflow-x:auto;font-size:12px}label{display:block;margin-top:10px}input{width:100%;margin-top:4px}button{margin-top:10px;padding:8px;width:100%}</style></head><body><h1>等间隔 Counter 速率计算</h1><section><h2>核心概念</h2><p>计算公式：若后值(C2) &ge; 前值(C1)，增量 = C2 - C1；若重置(C2 &lt; C1)，增量 = C2。最终平均速率 = 增量 / 时间间隔(Δt)。</p></section><section><h2>交互模拟</h2><label>Counter 序列 (data, 以逗号分隔): <input type="text" data-testid="data" value="100,50"></label><label>时间间隔 (parameter, s): <input type="number" data-testid="parameter" value="10"></label><button data-testid="run">计算</button><button data-testid="step">单步查看</button><button data-testid="reset">重置</button><pre data-testid="output">{}</pre></section><script>const dataIn = document.querySelector('[data-testid="data"]');const paramIn = document.querySelector('[data-testid="parameter"]');const out = document.querySelector('[data-testid="output"]');const run = document.querySelector('[data-testid="run"]');const step = document.querySelector('[data-testid="step"]');const reset = document.querySelector('[data-testid="reset"]');run.onclick = () => {const vals = dataIn.value.split(',').map(Number);const dt = Number(paramIn.value);if (vals.length < 2) { out.textContent = JSON.stringify({error:"至少需要两个样本"}); return; }if (dt <= 0) { out.textContent = JSON.stringify({error:"非法间隔: 必须大于0"}); return; }const c1 = vals[0]; const c2 = vals[1];const delta = c2 >= c1 ? (c2 - c1) : c2;out.textContent = JSON.stringify({rate: delta / dt});};step.onclick = () => {out.textContent = JSON.stringify({status: "正在分析样本间重置状态", c1: dataIn.value.split(',')[0], c2: dataIn.value.split(',')[1]});};reset.onclick = () => {dataIn.value = "100,50"; paramIn.value = "10"; out.textContent = JSON.stringify({ready: true});};</script></body></html>
