<!DOCTYPE html><html lang='zh-CN'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>浏览器事件循环教学</title><style>body{font-family:sans-serif;padding:10px;line-height:1.5;max-width:375px;margin:auto}#app{display:flex;flex-direction:column;gap:10px}pre{background:#eee;padding:10px;font-size:12px;overflow:auto;min-height:50px}button{padding:8px}label{font-weight:bold;margin-top:5px}</style></head><body><div id='app'><h1>事件循环模型</h1><p>执行顺序：同步代码 &rarr; 微任务 &rarr; 定时器。</p><label>输入任务序列:</label><input type='text' data-testid='data' id='data' placeholder='例如: Sync,Micro,Timer'><label>参数:</label><input type='text' data-testid='parameter' id='parameter' value='0'><div style='display:flex;gap:5px'><button id='run' data-testid='run'>执行(Run)</button><button id='step' data-testid='step'>单步(Step)</button><button id='reset' data-testid='reset'>重置(Reset)</button></div><pre data-testid='output' id='output'>{}</pre><h3>核心概念</h3><p><strong>同步任务</strong>：立即执行。<strong>微任务</strong>：同步执行后立即清空。<strong>定时器</strong>：宏任务，在微任务处理完后执行。</p><h3>误区</h3><p>认为 setTimeout(0) 会立即执行，实际上它会被推入宏任务队列，必须等待同步与微任务完成。</p></div><script>const state={steps:[],current:0};const output=document.getElementById('output');const run=()=>{const val=document.getElementById('data').value;const result={order:['sync','microtask','timer']};output.textContent=JSON.stringify(result)};const step=()=>{const sequence=['sync','microtask','timer'];if(state.current<sequence.length){state.steps.push(sequence[state.current]);state.current++;output.textContent=JSON.stringify({currentStep:state.steps})}};const reset=()=>{state.steps=[];state.current=0;output.textContent=JSON.stringify({ready:true})};document.getElementById('run').addEventListener('click',run);document.getElementById('step').addEventListener('click',step);document.getElementById('reset').addEventListener('click',reset);</script></body></html>
