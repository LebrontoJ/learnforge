<!DOCTYPE html><html lang='zh-CN'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>浏览器事件循环教学</title><style>body{font-family:sans-serif;padding:10px;line-height:1.5}#app{max-width:375px;margin:auto}pre{background:#eee;padding:10px;font-size:12px;overflow:auto}button{margin:2px}</style></head><body><div id='app'><h1>事件循环模型</h1><p>执行顺序：同步代码 -> 微任务 -> 定时器。</p><label>数据序列(逗号分隔任务):</label><input type='text' id='data' aria-label='data' placeholder='Sync1,Micro1,Timer1'><label>参数(无):</label><input type='text' id='parameter' aria-label='parameter' value='0'><button id='run'>执行(Run)</button><button id='step'>单步(Step)</button><button id='reset'>重置(Reset)</button><pre id='output'>{}</pre><h3>核心概念</h3><p><strong>同步任务</strong>：立即执行。<strong>微任务</strong>：同步任务后清空队列。<strong>定时器</strong>：宏任务，在微任务队列清空后调度。</p><h3>误区</h3><p>认为 setTimeout(0) 会立即执行，实际上它会被推入宏任务队列，必须等待同步与微任务完成。</p></div><script>const state={order:[]};const output=document.getElementById('output');document.getElementById('run').onclick=()=>{const input=document.getElementById('data').value.split(',');const res={order:['sync','microtask','timer']};output.textContent=JSON.stringify(res);};document.getElementById('step').onclick=()=>{if(state.order.length<3){state.order.push(['sync','microtask','timer'][state.order.length]);output.textContent=JSON.stringify({currentStep:state.order});}};document.getElementById('reset').onclick=()=>{state.order=[];output.textContent=JSON.stringify({ready:true});};</script></body></html>
