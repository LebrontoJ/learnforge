<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>LRU 缓存模拟器</title><style>body{font-family:sans-serif;padding:16px;line-height:1.5;font-size:14px;width:375px;margin:0 auto}section{margin-bottom:20px}pre{background:#f4f4f4;padding:10px;border-radius:4px;overflow-x:auto;font-size:12px}.controls{display:flex;flex-direction:column;gap:8px}input,button{padding:8px;font-size:14px}label{display:block;margin-bottom:8px}</style></head><body><h1>LRU 缓存教学</h1><section><h2>目标</h2><p>理解精确 LRU 的淘汰逻辑与边界条件。</p></section><section><h2>操作说明</h2><label>容量: <input id="parameter" type="number" aria-label="parameter" value="2"></label><label>键: <input id="data" type="text" aria-label="data" placeholder="输入键名"></label><div class="controls"><button id="run">插入/访问</button><button id="reset">重置</button></div><h3>结果:</h3><pre id="output" data-testid="output">{"cache": []}</pre></section><script>let cache = [];const output = document.getElementById('output');const paramInput = document.getElementById('parameter');const dataInput = document.getElementById('data');document.getElementById('run').onclick = () => {const capacity = parseInt(paramInput.value);const key = dataInput.value;if(isNaN(capacity) || capacity <= 0){output.textContent = JSON.stringify({error: "无效容量"});return;}if(!key){return;}const index = cache.indexOf(key);if(index !== -1){cache.splice(index, 1);}cache.push(key);if(cache.length > capacity){cache.shift();}output.textContent = JSON.stringify({cache: cache})};document.getElementById('reset').onclick = () => {cache = [];output.textContent = JSON.stringify({ready: true})};</script></body></html>
