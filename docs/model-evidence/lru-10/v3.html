<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>精确 LRU 缓存淘汰</title><style>body{font-family:sans-serif;padding:16px;line-height:1.5;font-size:14px;width:343px;margin:0 auto}section{margin-bottom:16px}h1{font-size:18px}pre{background:#f4f4f4;padding:10px;border-radius:4px;overflow-x:auto;font-size:12px}button{margin-right:8px;padding:8px 12px}input{width:100%;box-sizing:border-box;margin-top:4px;padding:8px}label{display:block;margin-top:8px}</style></head><body><h1>LRU 缓存教学</h1><section><h2>目标</h2><p>理解精确 LRU 的淘汰逻辑与边界条件。</p></section><section><h2>操作说明</h2><label>容量: <input id="parameter" type="number" aria-label="parameter"></label><label>键: <input id="data" type="text" aria-label="data" placeholder="输入键名"></label><div style="margin-top:12px"><button id="run" data-testid="run">执行操作</button><button id="step" data-testid="step">执行访问</button><button id="reset" data-testid="reset">重置</button></div><h3>输出:</h3><pre id="output" data-testid="output">{"cache": []}</pre></section><script>let cache = [];const output = document.getElementById('output');const paramInput = document.getElementById('parameter');const dataInput = document.getElementById('data');document.getElementById('run').onclick = () => {const cap = parseInt(paramInput.value);const key = dataInput.value;if(isNaN(cap) || cap < 0){output.textContent = JSON.stringify({error: "无效容量"});return;}if(cap === 0){cache = [];} else {const index = cache.indexOf(key);if(index !== -1){cache.splice(index, 1);}cache.push(key);if(cache.length > cap){cache.shift();}}output.textContent = JSON.stringify({cache: cache})};document.getElementById('step').onclick = () => {const key = dataInput.value;const index = cache.indexOf(key);if(index !== -1){cache.splice(index, 1);cache.push(key);}output.textContent = JSON.stringify({cache: cache, status: index !== -1 ? "命中" : "未命中"})};document.getElementById('reset').onclick = () => {cache = [];output.textContent = JSON.stringify({ready: true})};</script></body></html>
