<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>LRU 缓存模拟器</title><style>body{font-family:sans-serif;padding:16px;line-height:1.5;font-size:14px}section{margin-bottom:20px}pre{background:#f4f4f4;padding:10px;border-radius:4px;overflow-x:auto}.controls{display:flex;flex-direction:column;gap:8px}input,button{padding:8px;font-size:14px}#output{color:#333}</style></head><body><h1>LRU 缓存教学</h1><section><h2>目标</h2><p>理解精确 LRU 的淘汰逻辑、边界条件以及缓存命中对顺序的影响。</p></section><section><h2>核心解释</h2><p>LRU (Least Recently Used) 核心在于：<strong>最近访问的元素会被移至队尾（最新）</strong>，当容量已满时，<strong>队头（最久未访问）元素被淘汰</strong>。</p></section><section><h2>误区</h2><p>LRU 并非 FIFO。FIFO 只看插入时间，而 LRU 会根据每一次“访问”重排队列。</p></section><section><h2>交互实验</h2><label>容量: <input id="parameter" type="number" aria-label="capacity" value="2"></label><label>键值: <input id="data" type="text" aria-label="data" placeholder="输入键名"></label><div class="controls"><button id="run">插入/访问</button><button id="reset">重置</button></div><h3>结果:</h3><pre id="output">{"cache": []}</pre></section><script>let cache = [];let capacity = 0;const output = document.getElementById('output');const paramInput = document.getElementById('parameter');const dataInput = document.getElementById('data');document.getElementById('run').onclick = () => {capacity = parseInt(paramInput.value) || 0;const key = dataInput.value;if(capacity <= 0){output.textContent = JSON.stringify({cache: []});return;}const index = cache.indexOf(key);if(index !== -1){cache.splice(index, 1);}cache.push(key);if(cache.length > capacity){cache.shift();}output.textContent = JSON.stringify({cache: cache})};document.getElementById('reset').onclick = () => {cache = [];output.textContent = JSON.stringify({ready: true})};</script></body></html>
