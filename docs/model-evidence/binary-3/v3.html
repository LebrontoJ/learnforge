<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>二分查找教学</title><style>body{font-family:sans-serif;padding:16px;line-height:1.5;max-width:375px;margin:auto}section{margin-bottom:20px}pre{background:#f4f4f4;padding:8px;overflow-x:auto;word-break:break-all;font-size:12px}button{margin:4px;padding:8px;cursor:pointer}input{display:block;width:90%;margin:8px 0}</style></head><body><h1>二分查找：建立概念</h1><section><h2>原理</h2><p>二分查找通过维护闭区间 [left, right]，每次比较目标值与中点值，将查找空间减半。当 left > right 时，搜索结束。<strong>注意</strong>：数组必须是有序的。</p><p><strong>例子</strong>：[1,3,5,7,9] 查找 7。初始 left=0, right=4, mid=2。因为 7 > 5，更新 left=mid+1 即 3。</p><p><strong>误区</strong>：很多初学者会忽略边界条件 (left > right) 导致死循环。</p></section><section><h2>交互演示</h2><label>数组(逗号分隔):<input type="text" id="data" data-testid="data" value="1,3,5,7,9"></label><label>目标值:<input type="text" id="parameter" data-testid="parameter" value="7"></label><button id="run">Run</button><button id="step">Step</button><button id="reset">Reset</button><pre id="output" data-testid="output">{}</pre></section><script>(function(){let state = {arr:[], target:0, left:0, right:0, finished:false, found:-1};const output = document.getElementById('output');document.getElementById('reset').addEventListener('click', ()=>{state={arr:[], target:0, left:0, right:0, finished:false, found:-1};output.textContent=JSON.stringify({ready:true})});document.getElementById('run').addEventListener('click', ()=>{const data=document.getElementById('data').value.split(',').filter(v=>v.trim()!=='').map(Number);const target=Number(document.getElementById('parameter').value);if(data.length===0){output.textContent=JSON.stringify({found:-1});return}let l=0, r=data.length-1;let found=-1;while(l<=r){let m=Math.floor((l+r)/2);if(data[m]===target){found=m;break}else if(data[m]<target)l=m+1;else r=m-1}output.textContent=JSON.stringify({found:found})});document.getElementById('step').addEventListener('click', ()=>{if(state.arr.length===0){state.arr=document.getElementById('data').value.split(',').filter(v=>v.trim()!=='').map(Number);state.target=Number(document.getElementById('parameter').value);state.left=0;state.right=state.arr.length-1;state.finished=false;state.found=-1}if(state.arr.length===0){output.textContent=JSON.stringify({found:-1});return}if(state.left>state.right){output.textContent=JSON.stringify({found:-1, status:"not found"});state.finished=true;return}let mid=Math.floor((state.left+state.right)/2);if(state.arr[mid]===state.target){state.found=mid;output.textContent=JSON.stringify({found:mid, status:"found"});state.finished=true}else if(state.arr[mid]<state.target){state.left=mid+1;output.textContent=JSON.stringify({left:state.left,right:state.right,mid:mid})}else{state.right=mid-1;output.textContent=JSON.stringify({left:state.left,right:state.right,mid:mid})}})})()</script></body></html>
