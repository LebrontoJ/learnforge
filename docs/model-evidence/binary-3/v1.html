<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>二分查找教学</title><style>body{font-family:sans-serif;padding:16px;line-height:1.5;max-width:375px;margin:auto}section{margin-bottom:20px}pre{background:#f4f4f4;padding:8px;overflow-x:auto}button{margin:4px;padding:8px}input{display:block;width:90%;margin:8px 0}</style></head><body><h1>二分查找：建立概念</h1><section><h2>原理</h2><p>二分查找通过维护闭区间 [left, right]，每次比较目标值与中点值，将查找空间减半。当 left > right 时，搜索结束。</p><p>例子：[1,3,5,7,9] 查找 7。初始 left=0, right=4, mid=2。7>5，更新 left=3。</p></section><section><h2>交互演示</h2><label>数组(逗号分隔):<input type="text" id="data" data-testid="data" value="1,3,5,7,9"></label><label>目标值:<input type="text" id="parameter" data-testid="parameter" value="7"></label><button id="run">Run</button><button id="step">Step</button><button id="reset">Reset</button><pre id="output" data-testid="output">{}</pre></section><script>let state = {arr:[], target:0, left:0, right:0, finished:false};document.getElementById('reset').onclick=()=>{state={arr:[], target:0, left:0, right:0, finished:false};document.getElementById('output').textContent=JSON.stringify({ready:true})};document.getElementById('run').onclick=()=>{const data=document.getElementById('data').value.split(',').map(Number);const target=Number(document.getElementById('parameter').value);let l=0, r=data.length-1;while(l<=r){let m=Math.floor((l+r)/2);if(data[m]===target){document.getElementById('output').textContent=JSON.stringify({found:m});return}else if(data[m]<target)l=m+1;else r=m-1}document.getElementById('output').textContent=JSON.stringify({found:-1})};document.getElementById('step').onclick=()=>{if(state.arr.length===0){state.arr=document.getElementById('data').value.split(',').map(Number);state.target=Number(document.getElementById('parameter').value);state.left=0;state.right=state.arr.length-1}if(state.left>state.right){document.getElementById('output').textContent=JSON.stringify({found:-1});return}let mid=Math.floor((state.left+state.right)/2);if(state.arr[mid]===state.target){document.getElementById('output').textContent=JSON.stringify({found:mid});state.finished=true}else if(state.arr[mid]<state.target){state.left=mid+1}else{state.right=mid-1}document.getElementById('output').textContent=JSON.stringify({left:state.left,right:state.right,mid:mid})}</script></body></html>
