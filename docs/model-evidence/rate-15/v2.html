<!DOCTYPE html><html lang='zh-CN'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Counter 重置速率计算教学</title><style>body{font-family:sans-serif;padding:15px;line-height:1.6;font-size:14px;max-width:375px;margin:auto;}pre{background:#f4f4f4;padding:10px;overflow-x:auto;word-break:break-all;}button{margin:5px 0;padding:8px;width:100%;}input{width:100%;margin-bottom:10px;box-sizing:border-box;}</style></head><body><h1>Counter 重置速率计算</h1><p><b>目标</b>：理解 Counter 重置后如何计算平均速率。</p><section><h3>核心解释</h3><p>当计数器(Counter)从高值突然归零或减小时，系统将其视为“重置”。此时，应将新值直接视为本次增量，而非视为负增长。</p></section><section><h3>示例</h3><p>T1(100) -> T2(10)，间隔10秒。正常差值 -90，重置逻辑增量 = 10，速率 = 10/10 = 1/s。</p></section><section><h3>互动测试</h3><label>输入序列(用逗号隔开): <input type='text' id='data' data-testid='data' aria-label='数值序列'></label><label>间隔(秒): <input type='text' id='parameter' data-testid='parameter' aria-label='时间间隔'></label><button id='run' data-testid='run'>计算速率</button><button id='step' data-testid='step'>单步查看</button><button id='reset' data-testid='reset'>重置</button><pre id='output' data-testid='output'>{}</pre></section><script>let history=[];const d=document.getElementById('data'),p=document.getElementById('parameter'),out=document.getElementById('output');const run=document.getElementById('run'),step=document.getElementById('step'),res=document.getElementById('reset');run.onclick=()=>{const vals=d.value.split(',').map(Number).filter(n=>!isNaN(n));const t=Number(p.value);if(t<=0){out.textContent=JSON.stringify({error:'非法间隔'});return;}if(vals.length<2){out.textContent=JSON.stringify(null);return;}let totalDelta=0;for(let i=1;i<vals.length;i++){totalDelta+=(vals[i]>=vals[i-1])?(vals[i]-vals[i-1]):vals[i];}out.textContent=JSON.stringify({rate:totalDelta/(t*(vals.length-1))});};step.onclick=()=>{const vals=d.value.split(',').map(Number);history.push(vals.shift());out.textContent=JSON.stringify({status:'processing',current:history[history.length-1]});};res.onclick=()=>{d.value='';p.value='';history=[];out.textContent=JSON.stringify({ready:true});};</script></body></html>
