<!DOCTYPE html><html lang='zh-CN'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Counter 重置速率计算教学</title><style>body{font-family:sans-serif;padding:20px;line-height:1.6;font-size:14px;max-width:375px;margin:auto;}pre{background:#f4f4f4;padding:10px;overflow-x:auto;}button{margin:5px 0;padding:8px;width:100%;}</style></head><body><h1>Counter 重置速率计算</h1><p><b>目标</b>：理解 Counter 重置后如何计算平均速率。</p><section><h3>核心解释</h3><p>当计数器(Counter)从高值突然归零或减小时，系统将其视为“重置”。此时，应将新值直接视为本次增量，而非视为负增长。</p></section><section><h3>示例</h3><p>T1(100) -> T2(10)，间隔10秒。正常差值 -90，重置逻辑增量 = 10，速率 = 10/10 = 1/s。</p></section><section><h3>误区</h3><p>误认为负差值应被丢弃或计为 0。事实上，重置后新值依然包含自上次重置以来产生的增量。</p></section><section><h3>互动测试</h3><label>起始值: <input type='text' id='start' aria-label='起始 Counter 值'></label><label>结束值: <input type='text' id='end' aria-label='结束 Counter 值'></label><label>间隔(s): <input type='text' id='interval' data-testid='parameter' aria-label='时间间隔'></label><button id='run'>计算速率</button><button id='reset'>重置</button><pre id='output' data-testid='output'>{}</pre></section><script>const start = document.getElementById('start');const end = document.getElementById('end');const interval = document.getElementById('interval');const run = document.getElementById('run');const res = document.getElementById('reset');const output = document.getElementById('output');run.onclick=()=>{const s=Number(start.value),e=Number(end.value),t=Number(interval.value);if(t<=0){output.textContent=JSON.stringify({error:'非法间隔'});return;}let delta=(e>=s)?(e-s):e;output.textContent=JSON.stringify({rate:delta/t,reset:e<s,delta:delta});};res.onclick=()=>{start.value='';end.value='';interval.value='';output.textContent=JSON.stringify({ready:true});};</script></body></html>
