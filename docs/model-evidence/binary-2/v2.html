<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>二分查找教学</title><style>body{font-family:sans-serif;padding:15px;line-height:1.6;max-width:375px}pre{background:#f4f4f4;padding:10px;white-space:pre-wrap;word-break:break-all;font-size:12px}button{margin:4px;padding:8px;cursor:pointer}label{display:block;margin-top:10px}</style></head><body><h1>二分查找：建立概念与直觉</h1><section><h2>核心原理</h2><p>二分查找通过在有序数组中维护闭区间 [left, right]，将目标值与中点进行比较。若中点大于目标，则目标必然在左半部分，否则在右半部分。每一步将搜索空间减半。</p><p><strong>误区：</strong>认为二分查找适用于任何数组。事实上，必须满足数组预先排序的前提。</p></section><section><h2>交互演示</h2><label>有序数组 (逗号分隔):</label><input type="text" id="data" data-testid="data" value="1,3,5,7,9" aria-label="数组"> <label>目标值:</label><input type="text" id="parameter" data-testid="parameter" value="3" aria-label="目标值"><br><button id="run" data-testid="run">运行</button><button id="step" data-testid="step">单步</button><button id="reset" data-testid="reset">重置</button><pre id="output" data-testid="output">{}</pre></section><script>(function(){let state={left:0,right:0,arr:[],target:0,started:false};const output=document.getElementById('output');const reset=()=>{state={left:0,right:-1,arr:[],target:0,started:false};output.textContent=JSON.stringify({ready:true});};document.getElementById('reset').addEventListener('click',reset);document.getElementById('run').addEventListener('click',()=>{const arr=document.getElementById('data').value.split(',').map(Number);const target=Number(document.getElementById('parameter').value);let l=0,r=arr.length-1;while(l<=r){let m=Math.floor((l+r)/2);if(arr[m]===target){output.textContent=JSON.stringify({found:m});return;}if(arr[m]<target)l=m+1;else r=m-1;}output.textContent=JSON.stringify({found:-1});});document.getElementById('step').addEventListener('click',()=>{if(!state.started){state.arr=document.getElementById('data').value.split(',').map(Number);state.target=Number(document.getElementById('parameter').value);state.left=0;state.right=state.arr.length-1;state.started=true;}if(state.left<=state.right){let mid=Math.floor((state.left+state.right)/2);if(state.arr[mid]===state.target){output.textContent=JSON.stringify({found:mid});state.started=false;}else{if(state.arr[mid]<state.target)state.left=mid+1;else state.right=mid-1;output.textContent=JSON.stringify({left:state.left,right:state.right,mid:mid});}}else{output.textContent=JSON.stringify({found:-1});state.started=false;}});})();</script></body></html>
