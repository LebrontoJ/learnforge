<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>二分查找教学</title><style>body{font-family:sans-serif;padding:20px;line-height:1.6;max-width:375px}pre{background:#f4f4f4;padding:10px;overflow-x:auto}button{margin:5px 0;padding:8px;cursor:pointer}</style></head><body><h1>二分查找：核心逻辑</h1><section><h2>核心原理</h2><p>二分查找通过维护闭区间 [left, right]，每次取中点 mid 与目标比对，将搜索范围减半。</p><p><strong>误区：</strong>二分查找不适用于无序数组，必须预先排序。</p></section><section><h2>交互演示</h2><label>有序数组 (逗号分隔):</label><input type="text" id="data" data-testid="data" value="1,3,5,7,9" aria-label="数组"><br><label>目标值:</label><input type="text" id="parameter" value="3" aria-label="目标值"><br><button id="run">运行全过程</button><button id="step">单步执行</button><button id="reset">重置</button><pre id="output">{}</pre></section><script>(function(){let state={left:0,right:0,arr:[],target:0,started:false};const output=document.getElementById('output');const reset=()=>{state={left:0,right:-1,arr:[],target:0,started:false};output.textContent=JSON.stringify({ready:true});};document.getElementById('reset').onclick=reset;document.getElementById('run').onclick=()=>{const arr=document.getElementById('data').value.split(',').map(Number);const target=Number(document.getElementById('parameter').value);let l=0,r=arr.length-1;while(l<=r){let m=Math.floor((l+r)/2);if(arr[m]===target){output.textContent=JSON.stringify({found:m});return;}if(arr[m]<target)l=m+1;else r=m-1;}output.textContent=JSON.stringify({found:-1});};document.getElementById('step').onclick=()=>{if(!state.started){state.arr=document.getElementById('data').value.split(',').map(Number);state.target=Number(document.getElementById('parameter').value);state.left=0;state.right=state.arr.length-1;state.started=true;}if(state.left<=state.right){let mid=Math.floor((state.left+state.right)/2);if(state.arr[mid]===state.target){output.textContent=JSON.stringify({status:"found",index:mid});state.started=false;}else{if(state.arr[mid]<state.target)state.left=mid+1;else state.right=mid-1;output.textContent=JSON.stringify({left:state.left,right:state.right,mid:mid});}}else{output.textContent=JSON.stringify({found:-1});state.started=false;}};})();</script></body></html>
