<!DOCTYPE html><html lang='zh'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>精确 LRU 缓存淘汰：建立概念与直觉</title><style>body{font-family:sans-serif;padding:16px;line-height:1.6;color:#333;max-width:375px;margin:auto}h1{font-size:1.2rem}pre{background:#f4f4f4;padding:10px;overflow-x:auto}section{margin-bottom:20px}input{width:100%;margin:5px 0;padding:8px}button{margin:5px 0;padding:8px 16px;cursor:pointer}</style></head><body><h1>精确 LRU 缓存淘汰</h1><section><h2>核心原理</h2><p>LRU (Least Recently Used) 核心在于访问序列的重排：每次访问键时，将其移至“最近使用”端；当缓存满且未命中时，移除处于“最久未使用”端的键。</p><ul><li><b>误区：</b>常与 FIFO 混淆，忽略了访问操作带来的顺序调整。</li></ul></section><section><h2>零容量边界</h2><p>当容量为 0，任何访问都无法命中，且插入会立即被淘汰，缓存始终为空。</p></section><section><h2>交互模拟</h2><label>访问键序列(以逗号分隔):</label><input type='text' id='data' aria-label='data' placeholder='如: A,B,A,C'><label>缓存容量:</label><input type='text' id='parameter' aria-label='parameter' placeholder='如: 2'><button id='run'>run</button><button id='reset'>reset</button><pre id='output'>{}</pre></section><script>(function(){let cache=[];const runBtn=document.getElementById('run');const resetBtn=document.getElementById('reset');const dataInput=document.getElementById('data');const paramInput=document.getElementById('parameter');const output=document.getElementById('output');runBtn.onclick=()=>{const keys=dataInput.value.split(',').map(s=>s.trim()).filter(s=>s!=='');const cap=parseInt(paramInput.value);if(isNaN(cap)||cap<0){output.textContent=JSON.stringify({error:'非法容量'});return}if(cap===0){cache=[];}else{keys.forEach(key=>{const idx=cache.indexOf(key);if(idx>-1)cache.splice(idx,1);cache.push(key);if(cache.length>cap)cache.shift();});}output.textContent=JSON.stringify({cache:cache})};resetBtn.onclick=()=>{cache=[];output.textContent=JSON.stringify({ready:true})}})()</script></body></html>
