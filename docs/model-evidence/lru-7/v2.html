<!DOCTYPE html><html lang='zh'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>精确 LRU 缓存淘汰：建立概念与直觉</title><style>body{font-family:sans-serif;padding:16px;line-height:1.5;color:#333;margin:0 auto;width:375px;box-sizing:border-box}h1{font-size:1.2rem}pre{background:#f4f4f4;padding:10px;white-space:pre-wrap;word-break:break-all}section{margin-bottom:16px}label{display:block;margin-top:8px}input{width:100%;padding:8px;box-sizing:border-box;margin-top:4px}button{margin-top:10px;padding:8px 16px;cursor:pointer;width:100%}#output{font-family:monospace;font-size:0.9rem}</style></head><body><h1>精确 LRU 缓存淘汰</h1><section><h2>核心原理</h2><p>LRU (Least Recently Used) 通过维护一个序列，访问时将键移至“最近使用”端，缓存满时移除“最久未使用”端的键。</p><ul><li><b>误区：</b>常被误认为是 FIFO，忽略了访问操作带来的动态重排。</li></ul></section><section><h2>零容量边界</h2><p>容量为 0 时，访问均无法命中，且插入会直接丢弃，缓存始终为空。</p></section><section><h2>交互模拟</h2><label for='data'>访问键序列 (以逗号分隔):</label><input type='text' id='data' data-testid='data' placeholder='例如: A,B,A,C'><label for='parameter'>缓存容量:</label><input type='text' id='parameter' data-testid='parameter' placeholder='例如: 2'><button id='run' data-testid='run'>run</button><button id='reset' data-testid='reset'>reset</button><pre id='output' data-testid='output'>{}</pre></section><script>(function(){const runBtn=document.getElementById('run');const resetBtn=document.getElementById('reset');const dataInput=document.getElementById('data');const paramInput=document.getElementById('parameter');const output=document.getElementById('output');let currentCache=[];runBtn.addEventListener('click',()=>{const keys=dataInput.value.split(',').map(s=>s.trim()).filter(s=>s!=='');const cap=parseInt(paramInput.value);if(isNaN(cap)||cap<0){output.textContent=JSON.stringify({error:'非法容量'});return}if(cap===0){currentCache=[];}else{keys.forEach(key=>{const idx=currentCache.indexOf(key);if(idx>-1)currentCache.splice(idx,1);currentCache.push(key);if(currentCache.length>cap)currentCache.shift();});}output.textContent=JSON.stringify({cache:currentCache})});resetBtn.addEventListener('click',()=>{currentCache=[];output.textContent=JSON.stringify({ready:true})})})()</script></body></html>
