<!DOCTYPE html><html lang='zh'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>精确 LRU 缓存淘汰：建立概念与直觉</title><style>body{font-family:sans-serif;padding:16px;line-height:1.5;color:#333;margin:0 auto;width:375px;box-sizing:border-box}h1{font-size:1.2rem}pre{background:#f4f4f4;padding:10px;white-space:pre-wrap;word-break:break-all}section{margin-bottom:16px}label{display:block;margin-top:8px}input{width:100%;padding:8px;box-sizing:border-box;margin-top:4px}button{margin-top:10px;padding:8px 16px;cursor:pointer;width:100%}#output{font-family:monospace;font-size:0.9rem}</style></head><body><h1>精确 LRU 缓存淘汰</h1><section><h2>核心原理</h2><p>LRU (Least Recently Used) 核心在于维护一个序列，每次访问键时，将其移至“最近使用”端；当缓存满且发生未命中时，移除处于“最久未使用”端的键。</p><ul><li><b>误区：</b>认为 LRU 仅仅是简单的 FIFO（先进先出），忽略了访问操作会重排缓存顺序的特性。</li></ul></section><section><h2>零容量边界</h2><p>当缓存容量为零时，任何访问都无法命中，且插入操作会立即被淘汰，缓存始终保持为空。</p></section><section><h2>交互模拟</h2><label for='data'>访问键序列 (以逗号分隔):</label><input type='text' id='data' data-testid='data' placeholder='例如: A,B,A,C'><label for='parameter'>缓存容量:</label><input type='text' id='parameter' data-testid='parameter' placeholder='例如: 2'><button id='run' data-testid='run'>run</button><button id='step' data-testid='step'>step</button><button id='reset' data-testid='reset'>reset</button><pre id='output' data-testid='output'>{}</pre></section><script>(function(){const runBtn=document.getElementById('run');const stepBtn=document.getElementById('step');const resetBtn=document.getElementById('reset');const dataInput=document.getElementById('data');const paramInput=document.getElementById('parameter');const output=document.getElementById('output');let currentCache=[];let accessSequence=[];let currentIndex=0;runBtn.addEventListener('click',()=>{const keys=dataInput.value.split(',').map(s=>s.trim()).filter(s=>s!=='');const cap=parseInt(paramInput.value);if(isNaN(cap)||cap<0){output.textContent=JSON.stringify({error:'非法容量'});return}currentCache=[];keys.forEach(key=>{const idx=currentCache.indexOf(key);if(idx>-1)currentCache.splice(idx,1);currentCache.push(key);if(cap>0&&currentCache.length>cap)currentCache.shift();else if(cap===0)currentCache=[];});output.textContent=JSON.stringify({cache:currentCache})});stepBtn.addEventListener('click',()=>{const keys=dataInput.value.split(',').map(s=>s.trim()).filter(s=>s!=='');const cap=parseInt(paramInput.value);if(isNaN(cap)||cap<0){output.textContent=JSON.stringify({error:'非法容量'});return}if(currentIndex>=keys.length){currentIndex=0;currentCache=[]}const key=keys[currentIndex];const idx=currentCache.indexOf(key);if(idx>-1)currentCache.splice(idx,1);currentCache.push(key);if(cap>0&&currentCache.length>cap)currentCache.shift();else if(cap===0)currentCache=[];currentIndex++;output.textContent=JSON.stringify({step:currentIndex,cache:currentCache})});resetBtn.addEventListener('click',()=>{currentCache=[];currentIndex=0;output.textContent=JSON.stringify({ready:true})})})()</script></body></html>
