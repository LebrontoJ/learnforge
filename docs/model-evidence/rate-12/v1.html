<!DOCTYPE html><html lang='zh'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>等间隔 Counter 重置感知平均增量教学</title><style>body{font-family:sans-serif;line-height:1.5;padding:16px;max-width:375px;margin:0 auto}section{margin-bottom:20px}pre{background:#eee;padding:8px;overflow-x:auto}button{margin:4px}input{display:block;width:100%;margin-bottom:8px}</style></head><body><h1>等间隔 Counter 计算</h1><section><h2>目标</h2><p>理解 Counter 在重置发生时的平均增量计算逻辑。</p></section><section><h2>核心解释</h2><p>当 Counter 值在样本间减小时（如 10 -> 2），判定为重置。此时计算公式为：(重置后值) / (时间跨度)。若未重置，则为 (当前值 - 前值) / 时间跨度。</p></section><section><h2>误区</h2><p>不要使用 abs(val2 - val1) 或忽略重置点，这会掩盖真实的增量压力。</p></section><section><h2>交互计算</h2><label>样本序列 (val_1, val_2, ...)</label><input data-testid='data' placeholder='例如: 0,10,2,8' value='0,10,2,8'><label>间隔秒数 (parameter)</label><input data-testid='parameter' placeholder='例如: 10' value='10'><button data-testid='run'>计算速率</button><button data-testid='reset'>重置</button><pre data-testid='output'></pre></section><script>const runBtn = document.querySelector('[data-testid=run]');const resetBtn = document.querySelector('[data-testid=reset]');const dataInput = document.querySelector('[data-testid=data]');const paramInput = document.querySelector('[data-testid=parameter]');const output = document.querySelector('[data-testid=output]');runBtn.onclick = () => {const data = dataInput.value.split(',').map(Number);const interval = Number(paramInput.value);if(data.length < 2 || isNaN(interval) || interval <= 0){output.textContent = JSON.stringify({error: '样本不足或无效间隔'});return;}let totalIncrease = 0;for(let i = 1; i < data.length; i++){if(data[i] >= data[i-1]){totalIncrease += (data[i] - data[i-1]);}else{totalIncrease += data[i];}}const rate = totalIncrease / ((data.length - 1) * interval);output.textContent = JSON.stringify({rate: rate.toFixed(4)});};resetBtn.onclick = () => {dataInput.value = '0,10,2,8';paramInput.value = '10';output.textContent = JSON.stringify({ready: true});};</script></body></html>
