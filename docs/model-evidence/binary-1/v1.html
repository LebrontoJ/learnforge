<!DOCTYPE html><html lang='zh'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>二分查找交互教学</title><style>body{font-family:sans-serif;padding:10px;line-height:1.5;max-width:375px;margin:auto}section{margin-bottom:20px;border-bottom:1px solid #ccc;padding-bottom:10px}pre{background:#f4f4f4;padding:10px;overflow-x:auto;font-size:12px}button{margin:5px 0;padding:8px;width:100%}</style></head><body><h1>二分查找教学</h1><section><h2>原理</h2><p>二分查找要求数组有序，通过维护闭区间 [left, right] 排除一半搜索空间。</p><ul><li>目标比中点小：右边界移至 mid - 1。</li><li>目标比中点大：左边界移至 mid + 1。</li></ul></section><section><h2>交互演示</h2><label>数组 (逗号分隔):<input type='text' id='data' aria-label='data' value='1,3,5,7,9'></label><br><label>目标值:<input type='text' id='parameter' aria-label='parameter' value='3'></label><br><button id='reset'>重置 (reset)</button><button id='step'>单步执行 (step)</button><button id='run'>全量运行 (run)</button><pre id='output'></pre></section><script>let state = {arr: [], target: 0, left: -1, right: -1, done: false}; const out = document.getElementById('output'); const dataInput = document.getElementById('data'); const paramInput = document.getElementById('parameter'); document.getElementById('reset').onclick = () => {const arr = dataInput.value.split(',').map(Number); state = {arr, target: Number(paramInput.value), left: 0, right: arr.length - 1, done: arr.length === 0}; out.textContent = JSON.stringify({ready: true, state}); }; document.getElementById('step').onclick = () => {if(state.done || state.left > state.right) {out.textContent = JSON.stringify({found: -1}); return;} let mid = Math.floor((state.left + state.right) / 2); if(state.arr[mid] === state.target) {state.done = true; out.textContent = JSON.stringify({found: mid});} else if(state.arr[mid] < state.target) {state.left = mid + 1;} else {state.right = mid - 1;} out.textContent = JSON.stringify({left: state.left, right: state.right, mid}); }; document.getElementById('run').onclick = () => {let l = 0, r = state.arr.length - 1, found = -1; while(l <= r) {let m = Math.floor((l + r) / 2); if(state.arr[m] === state.target) {found = m; break;} else if(state.arr[m] < state.target) l = m + 1; else r = m - 1;} out.textContent = JSON.stringify({found}); };</script></body></html>
