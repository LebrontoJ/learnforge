<!DOCTYPE html><html lang='zh'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>LRU 缓存模拟器</title><style>body{font-family:sans-serif;padding:16px;line-height:1.5;color:#333;max-width:375px;margin:auto}pre{background:#eee;padding:10px;font-size:12px;overflow-x:auto}.input-group{margin:8px 0}.btn{padding:8px 12px;margin:4px 2px;cursor:pointer}</style></head><body><h1>LRU 缓存演示</h1><section><h2>核心概念</h2><p>最近最少使用 (LRU) 是一种缓存淘汰策略。其核心思想是：<strong>最近被访问的元素是“热数据”，最久未被访问的则是“冷数据”。</strong>当缓存达到容量上限时，优先淘汰那个最久未被访问的元素。</p><h3>关键点</h3><p>访问操作（即使是命中）也会更新元素的位置，将其移至“最近使用”端。</p><h3>误区</h3><p>不要认为 LRU 仅仅按插入先后进行淘汰，忽略了“命中刷新”机制。</p></section><section><h2>交互演示</h2><div class='input-group'><label>容量(N): <input type='text' id='parameter' data-testid='parameter' value='2'></label></div><div class='input-group'><label>访问序列: <input type='text' id='data' data-testid='data' value='A,B,C,B,A'></label></div><button id='run' data-testid='run' class='btn'>运行</button><button id='step' data-testid='step' class='btn'>单步</button><button id='reset' data-testid='reset' class='btn'>重置</button><h3>状态输出</h3><pre id='output' data-testid='output'>{"cache":[]}</pre></section><script>let state={cache:[],history:[],ptr:0};const getCap=()=>parseInt(document.getElementById('parameter').value)||0;const getData=()=>document.getElementById('data').value.split(',').map(s=>s.trim()).filter(s=>s);document.getElementById('run').addEventListener('click',()=>{const cap=getCap();const items=getData();let cache=[];for(const item of items){if(cache.includes(item)){cache=cache.filter(x=>x!==item);cache.push(item)}else{if(cache.length>=cap&&cap>0)cache.shift();if(cap>0)cache.push(item)}}document.getElementById('output').textContent=JSON.stringify({cache});state.history=items;state.ptr=items.length});document.getElementById('step').addEventListener('click',()=>{const cap=getCap();const items=getData();if(state.ptr>=items.length)return;const item=items[state.ptr];if(state.cache.includes(item)){state.cache=state.cache.filter(x=>x!==item);state.cache.push(item)}else{if(state.cache.length>=cap&&cap>0)state.cache.shift();if(state.cache.length<cap)state.cache.push(item)}state.ptr++;document.getElementById('output').textContent=JSON.stringify({cache:state.cache})});document.getElementById('reset').addEventListener('click',()=>{state={cache:[],history:[],ptr:0};document.getElementById('output').textContent=JSON.stringify({ready:true})});</script></body></html>
