<!DOCTYPE html><html lang='zh'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>LRU 缓存模拟器</title><style>body{font-family:sans-serif;padding:20px;line-height:1.5;color:#333;max-width:375px;margin:auto}pre{background:#f4f4f4;padding:10px;overflow-x:auto}.input-group{margin:10px 0}.btn{padding:5px 10px;margin:2px}</style></head><body><h1>LRU 缓存演示</h1><section><h2>核心概念</h2><p>最近最少使用 (LRU) 算法根据历史访问记录淘汰数据。当缓存满时，访问最久未使用的项优先被移除。</p><h3>例子</h3><p>容量 2，访问 A, B, A。A 访问后移动到末尾，被视为热数据。</p><h3>误区</h3><p>误认为 LRU 仅按插入顺序淘汰，忽略了访问（命中）会刷新元素的优先级。</p></section><section><h2>交互演示</h2><div class='input-group'><label>容量(N): <input type='text' id='parameter' aria-label='缓存容量' value='2'></label></div><div class='input-group'><label>访问序列: <input type='text' id='data' aria-label='访问序列' value='A,B,C,B,A'></label></div><button id='run' class='btn'>运行</button><button id='step' class='btn'>单步</button><button id='reset' class='btn'>重置</button><h3>状态输出</h3><pre id='output'>{"cache":[]}</pre></section><script>let state={cache:[],history:[],ptr:0};const getCap=()=>parseInt(document.getElementById('parameter').value)||0;const getData=()=>document.getElementById('data').value.split(',').map(s=>s.trim()).filter(s=>s);document.getElementById('run').onclick=()=>{const cap=getCap();const items=getData();let cache=[];for(const item of items){if(cache.includes(item)){cache=cache.filter(x=>x!==item);cache.push(item)}else{if(cache.length>=cap&&cap>0)cache.shift();if(cap>0)cache.push(item)}}document.getElementById('output').textContent=JSON.stringify({cache});state.history=items;state.ptr=items.length};document.getElementById('step').onclick=()=>{const cap=getCap();const items=getData();if(state.ptr>=items.length)return;const item=items[state.ptr];if(state.cache.includes(item)){state.cache=state.cache.filter(x=>x!==item);state.cache.push(item)}else{if(state.cache.length>=cap&&cap>0)state.cache.shift();if(cap>0)state.cache.push(item)}state.ptr++;document.getElementById('output').textContent=JSON.stringify({cache:state.cache})};document.getElementById('reset').onclick=()=>{state={cache:[],history:[],ptr:0};document.getElementById('output').textContent=JSON.stringify({ready:true})};</script></body></html>
