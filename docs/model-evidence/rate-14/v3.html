<!DOCTYPE html><html lang='zh'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Counter 重置感知速率计算</title><style>body{font-family:sans-serif;padding:16px;line-height:1.5;max-width:375px}pre{background:#f4f4f4;padding:8px;overflow-x:auto;word-break:break-all}div{margin-bottom:10px}button{padding:8px 12px;margin-right:4px}</style></head><body><h1>Counter 重置速率教学</h1><p>Counter 指标在重启时归零，本演示通过等间隔采样展示其处理逻辑。</p><h3>核心概念</h3><p>若当前值小于前值，视为重置，直接将当前值计为该周期增量。</p><h3>误区</h3><p>不要以为重置意味着应忽略该点或记为负数，实际应视作从0开始的累加。</p><div><input data-testid='data' placeholder='样本序列 (如: 100,110,5)' aria-label='样本序列'></div><div><input data-testid='parameter' placeholder='时间间隔(秒)' aria-label='时间间隔'></div><button data-testid='run'>计算速率</button><button data-testid='step'>单步演示</button><button data-testid='reset'>重置</button><pre data-testid='output'>{}</pre><script>(()=>{const runBtn=document.querySelector('[data-testid=run]');const stepBtn=document.querySelector('[data-testid=step]');const resetBtn=document.querySelector('[data-testid=reset]');const output=document.querySelector('[data-testid=output]');let stepIdx=0;let history=[];runBtn.onclick=()=>{const data=document.querySelector('[data-testid=data]').value.split(',').filter(x=>x!=='').map(Number);const interval=Number(document.querySelector('[data-testid=parameter]').value);if(interval<=0){output.textContent=JSON.stringify({error:'非法间隔'});return;}if(data.length<2){output.textContent='null';return;}let delta=0;for(let i=1;i<data.length;i++){delta+=(data[i]>=data[i-1])?(data[i]-data[i-1]):data[i];}output.textContent=JSON.stringify({rate:delta/((data.length-1)*interval)});};stepBtn.onclick=()=>{const val=document.querySelector('[data-testid=data]').value.split(',').map(Number);if(stepIdx===0) history=[];if(stepIdx<val.length){history.push(val[stepIdx]);stepIdx++;output.textContent=JSON.stringify({step:stepIdx,current:val[stepIdx-1],history});}else{output.textContent=JSON.stringify({status:'Finished',history});}};resetBtn.onclick=()=>{stepIdx=0;history=[];document.querySelector('[data-testid=data]').value='';document.querySelector('[data-testid=parameter]').value='';output.textContent=JSON.stringify({ready:true});};})();</script></body></html>
