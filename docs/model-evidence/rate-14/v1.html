<!DOCTYPE html><html lang='zh'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Counter 重置感知速率计算</title><style>body{font-family:sans-serif;padding:16px;line-height:1.5;max-width:375px}pre{background:#f4f4f4;padding:8px;overflow-x:auto}.controls{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}input{padding:8px}</style></head><body><h1>Counter 重置速率教学</h1><p>Counter 指标在重启时归零，本工具模拟如何处理重置带来的速率计算。</p><h3>核心概念</h3><p>当当前值小于前值时，系统判定发生重置。简化算法将重置后的当前值直接视为该周期的增量。</p><div class='controls'><input data-testid='data' placeholder='样本序列 (如: 100,110,5)' aria-label='样本序列'><input data-testid='parameter' placeholder='时间间隔(秒)' aria-label='时间间隔'><button data-testid='run'>计算速率</button><button data-testid='reset'>重置</button></div><pre data-testid='output'>{}</pre><script>const runBtn=document.querySelector('[data-testid=run]');const resetBtn=document.querySelector('[data-testid=reset]');const output=document.querySelector('[data-testid=output]');runBtn.onclick=()=>{const dataStr=document.querySelector('[data-testid=data]').value;const paramStr=document.querySelector('[data-testid=parameter]').value;const data=dataStr.split(',').map(Number);const interval=Number(paramStr);if(interval<=0){output.textContent=JSON.stringify({error:'非法间隔'});return;}if(data.length<2){output.textContent='null';return;}let totalDelta=0;for(let i=1;i<data.length;i++){if(data[i]>=data[i-1]){totalDelta+=(data[i]-data[i-1]);}else{totalDelta+=data[i];}}const rate=totalDelta/((data.length-1)*interval);output.textContent=JSON.stringify({rate:rate});};resetBtn.onclick=()=>{document.querySelector('[data-testid=data]').value='';document.querySelector('[data-testid=parameter]').value='';output.textContent=JSON.stringify({ready:true});};</script></body></html>
