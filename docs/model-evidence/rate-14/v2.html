<!DOCTYPE html><html lang='zh'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Counter 重置感知速率计算</title><style>body{font-family:sans-serif;padding:16px;line-height:1.5;max-width:375px}pre{background:#f4f4f4;padding:8px;overflow-x:auto;word-break:break-all}div{margin-bottom:10px}button{padding:8px 16px;margin-right:8px}</style></head><body><h1>Counter 重置速率教学</h1><p>Counter 指标在重启时归零，本工具模拟重置处理逻辑。</p><h3>核心概念</h3><p>当当前值小于前值时，系统判定发生重置。简化算法将重置后的当前值直接视为该周期的增量。</p><h3>例子</h3><p>序列 100,110,5；间隔 10s。<br>前 10s: 110-100=10；后 10s: 重置(5-110 < 0)，取 5。<br>总增量 15，总时长 20s，平均速率 0.75。</p><div><input data-testid='data' placeholder='样本序列 (如: 100,110,5)' aria-label='样本序列'></div><div><input data-testid='parameter' placeholder='时间间隔(秒)' aria-label='时间间隔'></div><button data-testid='run'>计算速率</button><button data-testid='step'>单步演示</button><button data-testid='reset'>重置</button><pre data-testid='output'>{}</pre><script>const runBtn=document.querySelector('[data-testid=run]');const stepBtn=document.querySelector('[data-testid=step]');const resetBtn=document.querySelector('[data-testid=reset]');const output=document.querySelector('[data-testid=output]');let stepIndex=0;let stepData=[];runBtn.onclick=()=>{const dataStr=document.querySelector('[data-testid=data]').value;const paramStr=document.querySelector('[data-testid=parameter]').value;const data=dataStr.split(',').map(Number);const interval=Number(paramStr);if(interval<=0){output.textContent=JSON.stringify({error:'非法间隔'});return;}if(data.length<2){output.textContent='null';return;}let totalDelta=0;for(let i=1;i<data.length;i++){if(data[i]>=data[i-1]){totalDelta+=(data[i]-data[i-1]);}else{totalDelta+=data[i];}}output.textContent=JSON.stringify({rate:totalDelta/((data.length-1)*interval)});};stepBtn.onclick=()=>{const dataStr=document.querySelector('[data-testid=data]').value;if(stepIndex===0) stepData=dataStr.split(',').map(Number);if(stepIndex<stepData.length-1){stepIndex++;output.textContent=JSON.stringify({step:stepIndex,value:stepData[stepIndex],status:'Processed'});}else{output.textContent=JSON.stringify({status:'Finished'});}};resetBtn.onclick=()=>{document.querySelector('[data-testid=data]').value='';document.querySelector('[data-testid=parameter]').value='';stepIndex=0;output.textContent=JSON.stringify({ready:true});};</script></body></html>
