<!DOCTYPE html><html lang='zh'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>二分查找教学</title><style>body{font-family:sans-serif;padding:10px;line-height:1.5;max-width:375px;margin:auto}section{margin-bottom:20px}pre{background:#eee;padding:10px;overflow-x:auto;font-size:12px}button{padding:8px;margin-right:5px}input{display:block;width:90%;margin:5px 0}label{font-weight:bold;font-size:14px}</style></head><body><h1>二分查找：核心原理</h1><section><p>二分查找通过维护闭区间 <code>[left, right]</code> 每次排除一半搜索空间。目标：理解中点计算与指针更新。</p></section><section><h2>交互演示</h2><label>数组 (JSON):</label><input data-testid='data' value='[1,3,5,7,9]'><label>目标值:</label><input data-testid='parameter' value='3'><button id='run' aria-label='执行步骤'>单步</button><button id='reset' aria-label='重置数据'>重置</button><pre id='output'>{}</pre></section><script>let state = {arr:[], target:0, left:0, right:0, ready:false}; document.getElementById('reset').onclick = () => { try { state.arr = JSON.parse(document.querySelector('[data-testid=data]').value); state.target = Number(document.querySelector('[data-testid=parameter]').value); state.left = 0; state.right = state.arr.length - 1; state.ready = true; document.getElementById('output').textContent = JSON.stringify({ready:true, left:state.left, right:state.right}); } catch(e) { document.getElementById('output').textContent = 'JSON解析错误'; } }; document.getElementById('run').onclick = () => { if (!state.ready) return; if (state.left <= state.right) { let mid = Math.floor((state.left + state.right) / 2); let val = state.arr[mid]; if (val === state.target) { document.getElementById('output').textContent = JSON.stringify({found: mid}); state.ready = false; } else if (val < state.target) { state.left = mid + 1; document.getElementById('output').textContent = JSON.stringify({status: '右半区间', left: state.left, right: state.right}); } else { state.right = mid - 1; document.getElementById('output').textContent = JSON.stringify({status: '左半区间', left: state.left, right: state.right}); } } else { document.getElementById('output').textContent = JSON.stringify({found: -1}); state.ready = false; } };</script></body></html>
