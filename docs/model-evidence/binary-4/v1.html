<!DOCTYPE html><html lang='zh'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>二分查找教学</title><style>body{font-family:sans-serif;padding:10px;line-height:1.5}pre{background:#eee;padding:10px;overflow-x:auto}button{margin:5px;padding:8px}section{margin-bottom:20px}</style></head><body><h1>二分查找：建立概念与直觉</h1><section><h2>核心原理</h2><p>二分查找通过维护闭区间 [left, right] 将搜索范围减半。关键点在于：mid = floor((left + right) / 2)，根据比较结果将区间调整为 [left, mid-1] 或 [mid+1, right]。</p></section><section><h2>例子</h2><p>数组 [1, 3, 5, 7, 9]，查找 3。mid 初始为 5 (index 2)，3 < 5，更新 right = mid - 1 = 1，缩小至区间 [0, 1]。</p></section><section><h2>误区</h2><p>常见的错误是循环条件写成 left < right 或区间更新忘记 ±1，这会导致死循环或越界。</p></section><section><h2>交互演示</h2><label>数据 (JSON数组):</label><input data-testid='data' value='[1,3,5,7,9]'><label>目标:</label><input data-testid='parameter' value='3'><button id='run'>单步</button><button id='reset'>重置</button><pre id='output'>{}</pre></section><script>let state = {arr:[], target:0, left:0, right:0, ready:false}; document.getElementById('reset').onclick = () => { try { state.arr = JSON.parse(document.querySelector('[data-testid=data]').value); state.target = Number(document.querySelector('[data-testid=parameter]').value); state.left = 0; state.right = state.arr.length - 1; state.ready = true; document.getElementById('output').textContent = JSON.stringify({ready:true}); } catch(e) { document.getElementById('output').textContent = 'Error'; } }; document.getElementById('run').onclick = () => { if (!state.ready) return; if (state.left <= state.right) { let mid = Math.floor((state.left + state.right) / 2); if (state.arr[mid] === state.target) { document.getElementById('output').textContent = JSON.stringify({found: mid}); state.ready = false; } else if (state.arr[mid] < state.target) { state.left = mid + 1; document.getElementById('output').textContent = JSON.stringify({status: '右半区间', left: state.left, right: state.right}); } else { state.right = mid - 1; document.getElementById('output').textContent = JSON.stringify({status: '左半区间', left: state.left, right: state.right}); } } else { document.getElementById('output').textContent = JSON.stringify({found: -1}); state.ready = false; } };</script></body></html>
