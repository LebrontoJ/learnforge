<!DOCTYPE html><html lang='zh'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>二分查找教学</title><style>body{font-family:sans-serif;padding:10px;line-height:1.5;max-width:375px;margin:auto}section{margin-bottom:20px}pre{background:#eee;padding:10px;overflow-x:auto;font-size:12px;white-space:pre-wrap;word-break:break-all}button{padding:8px;margin-right:5px;cursor:pointer}input{display:block;width:90%;margin:5px 0}label{font-weight:bold;font-size:14px}</style></head><body><h1>二分查找：核心原理</h1><section><h2>目标</h2><p>理解二分查找通过维护闭区间 [left, right] 实现 O(log n) 高效检索的原理。</p></section><section><h2>误区提示</h2><p>二分查找仅限有序数组。注意 mid+1/mid-1 的处理，否则易造成死循环。</p></section><section><h2>交互演示</h2><label>数组 (JSON):</label><input data-testid='data' value='[1,3,5,7,9]'><label>目标值:</label><input data-testid='parameter' value='3'><button id='reset' aria-label='重置'>重置</button><button id='run' aria-label='单步'>单步</button><pre id='output'>{}</pre></section><script>let state = {arr:[], target:0, left:0, right:0, ready:false}; document.getElementById('reset').addEventListener('click', () => { try { state.arr = JSON.parse(document.querySelector('[data-testid=data]').value); state.target = Number(document.querySelector('[data-testid=parameter]').value); state.left = 0; state.right = state.arr.length - 1; state.ready = true; document.getElementById('output').textContent = JSON.stringify({ready:true, status:"已就绪", left:state.left, right:state.right}); } catch(e) { document.getElementById('output').textContent = 'JSON解析错误'; } }); document.getElementById('run').addEventListener('click', () => { if (!state.ready) return; if (state.left <= state.right) { let mid = Math.floor((state.left + state.right) / 2); let val = state.arr[mid]; if (val === state.target) { document.getElementById('output').textContent = JSON.stringify({found: mid}); state.ready = false; } else if (val < state.target) { state.left = mid + 1; document.getElementById('output').textContent = JSON.stringify({status: '向右搜索', left: state.left, right: state.right}); } else { state.right = mid - 1; document.getElementById('output').textContent = JSON.stringify({status: '向左搜索', left: state.left, right: state.right}); } if (state.left > state.right && state.ready) { document.getElementById('output').textContent = JSON.stringify({found: -1}); state.ready = false; } } else { document.getElementById('output').textContent = JSON.stringify({found: -1}); state.ready = false; } });</script></body></html>
