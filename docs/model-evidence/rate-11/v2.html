<!DOCTYPE html><html lang='zh-CN'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Counter重置速率计算</title><style>body{font-family:sans-serif;padding:16px;line-height:1.5;max-width:375px;margin:0 auto;box-sizing:border-box}section{margin-bottom:20px}pre{background:#f4f4f4;padding:10px;word-wrap:break-word;white-space:pre-wrap;border:1px solid #ccc}input{display:block;width:100%;margin:8px 0;padding:8px;box-sizing:border-box}button{padding:10px;margin:5px 5px 5px 0;cursor:pointer}</style></head><body><h1>等间隔 Counter 平均增量</h1><section><h2>核心解释</h2><p>若当前值 ≥ 上次值，增量为差值。若当前值 &lt; 上次值，判定为重置，增量为当前值本身。平均速率 = 增量 / 采样间隔。</p></section><section><h2>交互实验</h2><label>采样间隔(s): <input id='parameter' type='number' value='10' aria-label='采样间隔'/></label><label>当前 Counter 值: <input id='data' type='number' value='20' aria-label='当前 Counter 值'/></label><button id='run' aria-label='Run'>Run</button><button id='step' aria-label='Step'>Step</button><button id='reset' aria-label='Reset'>Reset</button><pre id='output' data-testid='output'>{}</pre></section><section><h2>误区与总结</h2><p>误区：重置时尝试回退计算。总结：本工具仅实现逻辑增量，不涉及 Prometheus 复杂的外推算法。</p></section><script>let lastVal = null;document.getElementById('reset').onclick=()=>{lastVal=null;document.getElementById('output').textContent=JSON.stringify({ready:true});};document.getElementById('run').onclick=()=>{const interval=parseFloat(document.getElementById('parameter').value);const current=parseFloat(document.getElementById('data').value);if(isNaN(interval)||interval<=0){document.getElementById('output').textContent=JSON.stringify({error:'间隔必须大于0'});return;}if(lastVal===null){lastVal=current;document.getElementById('output').textContent=JSON.stringify({status:'Initialized',lastVal});return;}const delta=current>=lastVal?current-lastVal:current;const rate=delta/interval;document.getElementById('output').textContent=JSON.stringify({rate:rate});lastVal=current;};document.getElementById('step').onclick=()=>{const current=parseFloat(document.getElementById('data').value);document.getElementById('output').textContent=JSON.stringify({status:'Intermediate',lastVal,current});};</script></body></html>
