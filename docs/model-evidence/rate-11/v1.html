<!DOCTYPE html><html lang='zh-CN'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Counter重置速率计算</title><style>body{font-family:sans-serif;padding:16px;line-height:1.5;max-width:375px;margin:auto}section{margin-bottom:20px}pre{background:#f4f4f4;padding:10px;overflow-x:auto}input{width:100%;margin:8px 0;padding:8px}button{padding:10px;margin-right:5px;cursor:pointer}</style></head><body><h1>等间隔 Counter 平均增量</h1><section><h2>核心解释</h2><p>当计数器值小于上一次值时，视为重置。此时，增量直接取当前值，不再计算差值。</p><ul><li><b>正常：</b>(当前值 - 上次值) / 间隔</li><li><b>重置：</b>当前值 / 间隔</li></ul></section><section><h2>交互实验</h2><label>采样间隔(s): <input id='param' type='number' value='10' aria-label='采样间隔'/></label><label>当前Counter值: <input id='data' type='number' value='20' aria-label='当前Counter值'/></label><button id='run' aria-label='计算'>Run</button><button id='reset' aria-label='重置'>Reset</button><pre id='output'></pre></section><section><h2>误区与总结</h2><p>误区：重置时尝试回退计算。总结：本工具仅实现逻辑增量，不含外推处理。</p></section><script>let lastVal = null;document.getElementById('reset').onclick=()=>{lastVal=null;document.getElementById('output').textContent=JSON.stringify({ready:true});};document.getElementById('run').onclick=()=>{const interval=parseFloat(document.getElementById('param').value);const current=parseFloat(document.getElementById('data').value);if(interval<=0){document.getElementById('output').textContent=JSON.stringify({error:'间隔必须大于0'});return;}if(lastVal===null){lastVal=current;document.getElementById('output').textContent=JSON.stringify({msg:'已初始化，再次点击计算速率'});return;}let delta=0;if(current>=lastVal){delta=current-lastVal;}else{delta=current;}const rate=delta/interval;const res={rate:rate};lastVal=current;document.getElementById('output').textContent=JSON.stringify(res);};</script></body></html>
