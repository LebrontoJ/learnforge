<!DOCTYPE html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width, initial-scale=1'><style>body{font-family:sans-serif;padding:16px;max-width:375px;margin:auto}pre{background:#eee;padding:8px;overflow-x:auto;font-size:12px;white-space:pre-wrap;word-break:break-all}.box{margin-bottom:16px}label{display:block;margin-bottom:4px;font-weight:bold}input{width:100%;box-sizing:border-box;padding:8px;margin-bottom:8px}button{padding:8px 16px;margin-right:4px;cursor:pointer}</style></head><body><h1>二分查找：建立概念与直觉</h1><section><h2>基本原理</h2><p>二分查找仅适用于<strong>有序数组</strong>。通过维护区间 [left, right]，不断缩窄搜索范围，最终定位目标值或确定其不存在，时间复杂度为 <strong>O(log n)</strong>。</p><p><strong>误区</strong>：认为任意数组都能二分。必须保证数据有序，否则逻辑将失效。</p></section><section><div class='box'><label>数组(逗号分隔):</label><input id='data' data-testid='data' value='1,3,5,7,9'></div><div class='box'><label>目标值:</label><input id='parameter' data-testid='parameter' value='7'></div><div class='box'><button id='reset' onclick='reset()'>Reset</button><button id='step' onclick='step()'>Step</button><button id='run' onclick='run()'>Run</button></div><pre id='output' data-testid='output'></pre></section><script>let state = {arr:[], target:0, left:0, right:0, finished:false};function isSorted(arr){for(let i=1;i<arr.length;i++)if(arr[i]<arr[i-1])return false;return true}function reset(){const data=document.getElementById('data').value.split(',').map(Number);const target=Number(document.getElementById('parameter').value);if(data.length===0){document.getElementById('output').textContent=JSON.stringify({found:-1});return}if(!isSorted(data)){document.getElementById('output').textContent=JSON.stringify({error:"数组必须有序"});return}state={arr:data,target:target,left:0,right:data.length-1,finished:false};document.getElementById('output').textContent=JSON.stringify({ready:true,left:state.left,right:state.right})}function step(){if(state.finished)return;if(state.left > state.right){state.finished=true;document.getElementById('output').textContent=JSON.stringify({found:-1});return}let mid=Math.floor((state.left+state.right)/2);if(state.arr[mid]===state.target){state.finished=true;document.getElementById('output').textContent=JSON.stringify({found:mid})}else if(state.arr[mid]<state.target){state.left=mid+1;document.getElementById('output').textContent=JSON.stringify({left:state.left,right:state.right,mid:mid})}else{state.right=mid-1;document.getElementById('output').textContent=JSON.stringify({left:state.left,right:state.right,mid:mid})}}function run(){reset();while(!state.finished)step()}</script></body></html>
