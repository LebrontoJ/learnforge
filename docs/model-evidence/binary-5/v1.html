<!DOCTYPE html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width, initial-scale=1'><style>body{font-family:sans-serif;padding:16px;max-width:375px;margin:auto}pre{background:#eee;padding:8px;overflow-x:auto}.box{margin-bottom:16px}label{display:block;margin-bottom:4px}input{width:100%;margin-bottom:8px}button{padding:8px;margin-right:4px}</style></head><body><h1>二分查找：建立概念与直觉</h1><section><h2>基本原理</h2><p>二分查找仅适用于有序数组。它通过维护区间 [left, right]，每次比较中点 mid，排除一半数据，时间复杂度为 O(log n)。</p><p><strong>例子</strong>：[1, 3, 5, 7, 9]，目标 7。初始 [0, 4]，mid=2(值5)，5<7，左边界移至 3，最终找到 7。</p><p><strong>误区</strong>：认为二分查找可直接用于无序数组。<strong>必须先排序</strong>。</p></section><section><h2>交互演示</h2><div class='box'><label>数组(逗号分隔):</label><input id='data' data-testid='data' value='1,3,5,7,9'></div><div class='box'><label>目标值:</label><input id='parameter' data-testid='parameter' value='7'></div><div class='box'><button id='reset' onclick='reset()'>Reset</button><button id='step' onclick='step()'>Step</button></div><pre id='output'>{}</pre></section><script>let state = {arr:[], target:0, left:0, right:0, finished:false}; function reset(){const data=document.getElementById('data').value.split(',').map(Number); const target=Number(document.getElementById('parameter').value); state={arr:data, target:target, left:0, right:data.length-1, finished:false}; document.getElementById('output').textContent=JSON.stringify({msg:'就绪', left:state.left, right:state.right});} function step(){if(state.finished) return; if(state.left > state.right){state.finished=true; document.getElementById('output').textContent=JSON.stringify({found:-1}); return;} let mid=Math.floor((state.left+state.right)/2); if(state.arr[mid]===state.target){state.finished=true; document.getElementById('output').textContent=JSON.stringify({found:mid});} else if(state.arr[mid]<state.target){state.left=mid+1; document.getElementById('output').textContent=JSON.stringify({left:state.left, right:state.right});} else{state.right=mid-1; document.getElementById('output').textContent=JSON.stringify({left:state.left, right:state.right});}}</script></body></html>
